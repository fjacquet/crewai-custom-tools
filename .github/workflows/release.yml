name: Release

# Déclenchement normal : push d'un tag v*.
#
# Déclenchement manuel (workflow_dispatch) : rattraper un tag déjà posé dont
# la release a échoué faute de section CHANGELOG — v0.31.1 en est l'exemple
# qui a motivé cet ajout (pyproject.toml bumpé au commit 19d78f7, mais
# l'entrée CHANGELOG n'a été ajoutée que plus tard, par 85566da, une fois le
# tag déjà poussé). `--verify-tag` n'exige pas que le tag pointe sur HEAD, et
# le tag n'est jamais déplacé : ce run relit CHANGELOG.md et pyproject.toml
# sur la branche par défaut (où l'entrée manquante a depuis été ajoutée),
# donc le tag à rattraper doit déjà correspondre à la version déclarée là.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex. v0.31.1) — sa release avait échoué et le CHANGELOG a été corrigé depuis"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Volontairement pas de `ref:` ici : sur workflow_dispatch on relit
      # CHANGELOG.md et pyproject.toml sur la branche choisie (par défaut la
      # branche par défaut du dépôt), pas sur le commit du tag à rattraper.
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve Release Tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # tests/test_scaffold.py compare __version__ et pyproject.toml entre eux,
      # mais rien ne vérifie que le tag est posé sur le bon commit. C'est le
      # seul mode de panne qui reste, et il doit bloquer avant publication.
      - name: Verify Tag Matches Declared Version
        run: |
          set -euo pipefail
          declaree="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${{ steps.tag.outputs.name }}" != "$declaree" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.name }}, mais pyproject.toml déclare $declaree"
            exit 1
          fi

      # Sortie non nulle si la section manque : jamais de release au corps vide.
      - name: Extract Release Notes
        run: |
          set -euo pipefail
          python scripts/extract_changelog.py "${{ steps.tag.outputs.name }}" --titre > "$RUNNER_TEMP/titre.txt"
          python scripts/extract_changelog.py "${{ steps.tag.outputs.name }}" > "$RUNNER_TEMP/corps.md"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.name }}" \
            --verify-tag \
            --title "$(cat "$RUNNER_TEMP/titre.txt")" \
            --notes-file "$RUNNER_TEMP/corps.md"
